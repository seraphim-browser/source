name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual run

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Git remotes
        run: |
          # Check if the 'upstream' remote exists
          git remote -v
          if ! git remote get-url upstream > /dev/null 2>&1; then
            echo "Adding upstream remote"
            git remote add upstream https://github.com/mozilla/gecko-dev.git
          else
            echo "Upstream remote already exists"
          fi

      - name: Fetch changes from upstream
        run: |
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/master --allow-unrelated-histories -m "Sync with upstream"

      - name: Push changes
        run: git push origin master
